name: deploy · gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - run: bun install --frozen-lockfile

      - name: Reset DB
        run: |
          rm -f db/data/ai-recommender.db
          bun run db:migrate
          bun run db:seed
          bun run db/seed-pages.ts

      - name: Sync models.dev
        run: bun run sync/modelsdev.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static
        run: bun run build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Smoke E2E
        run: |
          bun run preview &
          sleep 3
          HEALTH=$(curl -sS http://localhost:4321/api/health)
          echo "Health: $HEALTH" | head -c 200

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
