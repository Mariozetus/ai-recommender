name: ci · deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4' }
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Reset DB
        run: |
          rm -f db/data/ai-recommender.db
          bun run db:migrate
          bun run db:seed
          bun run db/seed-pages.ts
      - name: Sync models.dev
        run: bun run sync/modelsdev.ts
      - name: Generate data for build
        run: bun run build:data
      - name: Smoke E2E
        run: bun run smoke

  build:
    needs: test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4' }
      - run: bun install --frozen-lockfile
      - name: Generate data
        run: bun run build:data
      - name: Build static
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
